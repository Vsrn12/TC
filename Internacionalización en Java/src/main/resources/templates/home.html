<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{title}">Questionnaire</title>
    <link rel="stylesheet" href="/css/styles.css?v=2">
</head>
<body>
    <main>
        <div class="top-bar">
            <details class="language-menu">
                <summary th:text="#{language}">Language</summary>
                <div class="language-options">
                    <a href="/?lang=en" th:text="#{language.english}">English (United States)</a>
                    <a href="/?lang=es" th:text="#{language.spanish}">Spanish</a>
                </div>
            </details>
            <span class="date" th:text="${#messages.msg('date.label') + ' ' + currentDate}">Date: 09/09/2026</span>
        </div>

        <h1 th:text="#{title}">Questionnaire</h1>
        <p th:text="#{message}">Answer these three questions.</p>

        <form th:action="@{/(lang=${#locale.language})}" method="post" class="questionnaire-form">
            <div class="question">
                <label for="name" th:text="#{question.name}">What is your name?</label>
                <input id="name" name="name" type="text" required>
            </div>

            <div class="question">
                <label for="age" th:text="#{question.age}">How old are you?</label>
                <input id="age" name="age" type="number" min="0" required>
            </div>

            <div class="question">
                <label for="city" th:text="#{question.city}">What city do you live in?</label>
                <input id="city" name="city" type="text" required>
            </div>

            <button type="submit" th:text="#{submit}">Submit</button>
        </form>
    </main>
</body>
</html>
